  question: "What is the high alarm limit for CO2 during absorption?"
  language: en
  rig_specific: true
  expect:
    answerable: false
    key_facts: []
    relevant_documents: ["Rig_SOP_06_Operating_Limits_and_Corrective_Action.md"]
    relevant_nodes: ["Sensor:co2_ppm"]
  notes: "Relabelled 2026-11-13 (iteration 2) from SOP-CO2-SR-01 §8, which sets limits only for P-101, T-101 and pH-101; the iteration-1 label came from the retired amine drafts. No CO2 alarm limit is defined for this rig, so the correct answer says so."

