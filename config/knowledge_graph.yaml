- id: OperatingMode:Absorption
  type: OperatingMode
  label: Absorption
  aliases:
  - absorption
  - absorbing
  - capture mode
  - loading
  description: Lean solvent contacts flue gas; CO₂ is captured into solution.
- id: OperatingMode:Desorption
  type: OperatingMode
  label: Desorption
  aliases:
  - desorption
  - regeneration
  - stripping
  - release mode
  description: Rich solvent is heated to release CO₂ and regenerate the amine.
- id: OperatingMode:Manual
  type: OperatingMode
