<svg xmlns="http://www.w3.org/2000/svg" width="860" height="516" viewBox="0 0 860 516" role="img" aria-label="Example first run of ./daedalus.sh setup: it detects Ubuntu 24.04 on WSL with apt, checks python, node, pnpm, git, curl, ollama, the GPU and ports, finds pnpm missing, asks before running corepack enable pnpm, installs it, then creates .env, installs node modules and python packages, sets up the embedded chromadb, applies migrations, and prints the dev and start commands">
