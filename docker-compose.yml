# Daedalus — one container for the app, plus the stores it depends on.
#
#   docker compose up                          # app + vector DB
#   docker compose --profile with-ollama up    # also run Ollama in a container
#   docker compose --profile with-search up    # also run SearXNG (setup only)
#
# Four separate databases, on purpose (docs/PROJECT.md §6.3):
#
#   sensor  SQLite  /data/sqlite/sensor_readings.db  IoT telemetry   READ-ONLY to the AI
#   audit   SQLite  /logs/ai_logs.db                 chat/tool/RAG/model/error/feedback/memory logs
#   vector  Chroma  chromadb service                 RAG knowledge chunks
#   prefs   SQLite  /app/data/prefs.db               UI state
#
# Keeping them apart is the safety argument: a bug in ingestion or logging
# physically cannot reach the sensor data of record.

services:
  daedalus:
    build:
      context: .
      dockerfile: Dockerfile
      # Named explicitly. A Dockerfile's default target is its *last* stage, so
      # adding the `dev` stage at the bottom silently made `docker compose up`
      # build the development image — which sets DAEDALUS_STATIC_DIR away from
      # the bundle and serves a working API with no dashboard behind it.
      target: runtime
    image: daedalus:latest
    pull_policy: build
    container_name: daedalus
    ports:
      # Bound to localhost. Drop the 127.0.0.1 prefix only if you deliberately
      # want the lab LAN to reach it.
      - "127.0.0.1:${DAEDALUS_PORT:-8000}:8000"
    environment:
      # Every value here comes from .env (see .env.example), with the shipped
      # default as a fallback. Hardcoding them would silently override the
      # file that documents them as configurable.
      # host.docker.internal resolves to the host via the extra_hosts entry.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CHROMA_URL: ${CHROMA_URL:-http://chromadb:8000}
      DAEDALUS_DATA_DIR: ${DAEDALUS_DATA_DIR:-/data}
      DAEDALUS_LOG_DIR: ${DAEDALUS_LOG_DIR:-/logs}
      DAEDALUS_CHAT_DB: ${DAEDALUS_CHAT_DB:-/data/sqlite/chat.db}
      DAEDALUS_PREFS_DB: ${DAEDALUS_PREFS_DB:-/app/data/prefs.db}
      # Where the Forge writes the deployed model choice, and where FastAPI
      # reads it. Mounted from the repo below, so a choice committed in the
      # container survives a rebuild and is visible in a diff.
      DAEDALUS_CONFIG_DIR: ${DAEDALUS_CONFIG_DIR:-/config}
      # Hardware detection cadence. Defaults are fine; passed through so that
      # tuning them in .env works in the container too, not only in dev mode.
      DAEDALUS_HW_LIVE_INTERVAL: ${DAEDALUS_HW_LIVE_INTERVAL:-30}
      DAEDALUS_HW_SLOW_INTERVAL: ${DAEDALUS_HW_SLOW_INTERVAL:-300}
      DAEDALUS_HW_IDLE_AFTER: ${DAEDALUS_HW_IDLE_AFTER:-120}
      # Where the self-hosted search engine is, when the `with-search` profile
      # is running one. Only a default: a URL saved in Settings → Search wins,
      # and with neither, SearXNG is simply unconfigured.
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    volumes:
      # Sensor SQLite + documents. Mount the SCADA machine's real database
      # here (read-only at the driver level regardless).
      - ./data:/data
      # Audit/evaluation logs — ai_logs.db.
      - ./logs:/logs
      # The model choice the Forge commits — config, not data, so it lives in
      # the repo rather than in a volume nobody can read.
      - ./config:/config
      # UI preferences.
      - ./backend/data:/app/data
    depends_on:
      # service_started, not service_healthy: the dashboard and preference API
      # must boot even when the vector store is down, and vector_store.py
      # reports that as a status rather than failing. See the Databases panel.
      - chromadb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # RAG vector store. Runs as a server so the index survives app rebuilds and
  # the ingestion pipeline can write to it independently of the API.
  chromadb:
    image: chromadb/chroma:latest
    container_name: daedalus-chromadb
    ports:
      # Exposed so the offline ingestion pipeline can reach it from the host.
      - "127.0.0.1:${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma-data:/data
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"   # local-first: no outbound telemetry
      IS_PERSISTENT: "TRUE"
    # No healthcheck: the chroma image is minimal (dash only — no curl, wget,
    # python or bash), so nothing inside it can probe the port. Readiness is
    # reported by the app instead, via /api/system/databases.
    restart: unless-stopped

  # Optional: only starts with `--profile with-search`.
  #
  # Behind a profile rather than in the default stack, unlike Odysseus, which
  # runs it always. Rule 1 says the production runtime is offline, so a
  # deployed reactor assistant should not have a search engine sitting next to
  # it by default. It is started deliberately, while somebody is sourcing the
  # corpus, and stopped afterwards.
  #
  # Self-hosted for the reason that makes SearXNG the recommended provider in
  # the panel: the query goes to a container on this machine, which fans out to
  # public engines without a key, an account, or a third party holding a log of
  # what a reactor operator searched for.
  searxng:
    profiles: ["with-search"]
    # Pinned, not :latest. A search engine that silently changes behaviour
    # between two runs of a project whose results chapter cites what it found
    # is not a dependency, it is a variable.
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    container_name: daedalus-searxng
    # First boot seeds /etc/searxng from the mounted template with a generated
    # secret. Afterwards the volume's copy is authoritative, so an instance you
    # have tuned is never silently reset by a redeploy.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ] || grep -q '__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    ports:
      # Localhost only. This instance exists for one process on this machine.
      - "127.0.0.1:${SEARXNG_PORT:-8081}:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8081}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    # The image runs as the non-root `searxng` user, but its entrypoint still
    # chowns /etc/searxng on first boot and drops privileges with su-exec.
    # Without these four it fails setup with EACCES. Same set the upstream
    # searxng-docker compose file recommends.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Optional: only starts with `--profile with-ollama`.
  ollama:
    profiles: ["with-ollama"]
    image: ollama/ollama:latest
    container_name: daedalus-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # Uncomment for an NVIDIA GPU (needs the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  chroma-data:
  ollama-models:
  searxng-data:
